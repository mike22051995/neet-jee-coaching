# Render Blueprint — deploys the entire NEET/JEE coaching stack in one click.
# Docs: https://render.com/docs/blueprint-spec
#
# Services created:
#   neetjee-api    — FastAPI backend (Docker)
#   neetjee-web    — React frontend (static site)
#   neetjee-db     — PostgreSQL database (free tier)

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────
  - type: web
    name: neetjee-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # Render injects the DB connection string automatically
      - key: DATABASE_URL
        fromDatabase:
          name: neetjee-db
          property: connectionString

      # Random 64-char secret — Render generates this on first deploy
      - key: SECRET_KEY
        generateValue: true

      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "false"

      # Must match the frontend URL exactly (no trailing slash)
      - key: ALLOWED_ORIGINS
        value: https://neetjee-web.onrender.com

      - key: UPLOAD_DIR
        value: /app/uploads

      # Set these manually in the Render dashboard after first deploy
      # (never put real passwords in this file — it goes to GitHub)
      - key: ADMIN_EMAIL
        sync: false          # Render will prompt you to fill this in
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false

  # ── React Frontend (static site) ────────────────────────────────────────
  - type: web
    name: neetjee-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    plan: free
    envVars:
      # Tells the React app where the API lives at build time
      - key: VITE_API_URL
        value: https://neetjee-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # Send all paths to index.html so React Router handles navigation
      - type: rewrite
        source: /*
        destination: /index.html

# ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: neetjee-db
    databaseName: neetjee_db
    user: neetjee_user
    plan: free              # Free tier: 90 days, then $7/month
