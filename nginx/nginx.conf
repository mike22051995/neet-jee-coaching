# Nginx reverse proxy for the NEET/JEE coaching stack.
# Serves the React frontend and proxies /api/* to the FastAPI backend on a
# single port (80), so both share an origin and httpOnly cookies are
# set/sent without cross-origin complications.

upstream api {
    server backend:8000;
}

upstream frontend_dev {
    server frontend:5173;
}

server {
    listen 80;
    server_name _;

    # --- API + uploads → FastAPI backend --------------------------------
    location /api/ {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Ensure Set-Cookie headers pass through unmodified
        proxy_pass_header  Set-Cookie;
    }

    location /uploads/ {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
    }

    # --- Everything else → Vite dev server (supports HMR via WebSocket) -
    location / {
        proxy_pass             http://frontend_dev;
        proxy_set_header       Host              $host;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
    }
}
